name: Multiplatform CMake Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: c++${{ matrix.cxx_standard }}-${{ matrix.platform.name }}-${{ matrix.platform.compiler }}-${{ matrix.platform.arch }}-cmake-run
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        cxx_standard:
          - 20
          - 23

        platform:
          - { arch: x64, triplet: x64-linux, name: linux, os: ubuntu-24.04, compiler: gcc }
          - { arch: arm64, triplet: arm64-linux, name: linux, os: ubuntu-24.04, compiler: gcc }
          - { arch: x64, triplet: x64-linux, name: linux, os: ubuntu-24.04, compiler: clang }
          - { arch: arm64, triplet: arm64-linux, name: linux, os: ubuntu-24.04, compiler: clang }
          - { arch: x64, triplet: x64-osx, name: macos, os: macos-15, compiler: clang }
          - { arch: x64, triplet: x64-windows, name: windows, os: windows-2022, compiler: msvc }
          - { arch: x86, triplet: x86-windows, name: windows, os: windows-2022, compiler: msvc }
          - { arch: arm64, triplet: arm64-windows, name: windows, os: windows-2022, compiler: msvc }
          - { arch: x64, triplet: x64-mingw-dynamic, name: windows, os: windows-2022, compiler: mingw }
    env:
      vcpkgCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.platform.triplet }}
    steps:
      # Checkout project, including submodules
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      # Install latest CMake & Ninja
      - uses: lukka/get-cmake@latest
      
      # Optional: Setup vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: '${{ env.vcpkgCommitId }}'
          vcpkgJsonGlob: '**/scripts/example_vcpkg.json'

      - name: Prints output of run-vcpkg's action
        run: echo "root='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}', triplet='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}'"

        # Install QEMU and ARM64 cross-compiler/toolchain for arm64 builds on linux
      - name: Install QEMU and ARM64 GCC/G++
        if: matrix.platform.triplet == 'arm64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static
          
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version
          qemu-aarch64-static --version

        # Run CMake Build
      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-multi-${{ matrix.platform.compiler }}-${{ matrix.platform.arch }}'
          configurePresetAdditionalArgs: "['-DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}']"
          buildPreset: 'ninja-release-${{ matrix.platform.compiler }}-${{ matrix.platform.arch }}'
          testPreset: 'test-release-${{ matrix.platform.compiler }}-${{ matrix.platform.arch }}'
  all-checks-passed:
    name: All checks passed
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "One or more CMake builds failed."
          exit 1

      - name: All checks passed
        run: echo "All CMake builds passed!"

