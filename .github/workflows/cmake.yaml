name: Multiplatform CMake Run

on: [push, pull_request]

jobs:
  build:
    name: c++${{ matrix.cxx_standard }}-${{ matrix.platform.name }}-${{ matrix.platform.compiler }}-cmake-run
    runs-on: ${{ matrix.platform.os }}
    env:
      vcpkgCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'
    strategy:
      fail-fast: false
      matrix:
        cxx_standard:
          - 17
          - 20
          - 23

        platform:
          - { name: linux, os: ubuntu-24.04, compiler: gcc }
          - { name: linux, os: ubuntu-24.04, compiler: clang }
          - { name: macos, os: macos-15, compiler: clang }
          - { name: windows, os: windows-2022, compiler: msvc }
          - { name: windows, os: windows-2022, compiler: mingw }
    steps:
      # Checkout project, including submodules
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      # Install latest CMake & Ninja
      - uses: lukka/get-cmake@latest
      
      # Optional: Setup vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: '${{ env.vcpkgCommitId }}'
          vcpkgJsonGlob: '**/scripts/example_vcpkg.json'

      - name: Prints output of run-vcpkg's action
        run: echo "root='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}', triplet='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}'"

        # Run CMake Build
      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-multi-${{ matrix.platform.compiler }}'
          configurePresetAdditionalArgs: "['-DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}']"
          buildPreset: 'ninja-release-${{ matrix.platform.compiler }}'
          testPreset: 'test-${{ matrix.platform.compiler }}-release'
