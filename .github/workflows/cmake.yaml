name: Multiplatform CMake Run

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-cmake-run
    runs-on: ${{ matrix.os }}
    env:
      vcpkgCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022

        compiler:
          - gcc
          - clang
          - msvc
          - mingw

        cxx_standard:
          - 17
          - 20
          - 23

        exclude:
          # macOS
          - os: macos-15
            compiler: gcc
          - os: macos-15
            compiler: msvc
          - os: macos-15
            compiler: mingw

          # Ubuntu
          - os: ubuntu-24.04
            compiler: msvc
          - os: ubuntu-24.04
            compiler: mingw

          # Windows
          - os: windows-2022
            compiler: gcc
          - os: windows-2022
            compiler: clang
    steps:
      # Checkout project, including submodules
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      # Install latest CMake & Ninja
      - uses: lukka/get-cmake@latest
      
      # Optional: Setup vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: '${{ env.vcpkgCommitId }}'
          vcpkgJsonGlob: '**/scripts/example_vcpkg.json'

      - name: Prints output of run-vcpkg's action
        run: echo "root='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}', triplet='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}'"

        # Run CMake Build
      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-multi-${{ matrix.compiler }}'
          configurePresetAdditionalArgs: "['-DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}']"
          buildPreset: 'ninja-release-${{ matrix.compiler }}'
          testPreset: 'test-${{ matrix.compiler }}-release'
